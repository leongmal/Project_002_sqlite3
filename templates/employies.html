{% extends 'base.html' %}

{% block body %}
<div class="employees-list">
    <h2>Employee List</h2>

    {% if employies %}
        {% for employie in employies %}
        <div class="employee-card">
            <div class="employee-info">
                <span class="employee-name">{{ employie['name'] }}</span>
                <span class="employee-age">{{ employie['age'] }} years old</span>
            </div>
            <div class="employee-actions">
                <button class="btn-edit">Edit</button>
                <button class="btn-delete">Delete</button>
            </div>
        </div>
        {% endfor %}
    {% else %}
        <p class="no-employees">No employees found. Add some using the form!</p>
    {% endif %}
</div>
{% endblock %}
