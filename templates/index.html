{% extends 'base.html' %}

{% block body %}
<div class="form-container">
    <div class="form-header">
        <h2>Новый Договор
                        <!-- Вывод сообщений -->    
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'error' if category == 'error' else 'success' }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    
        <!-- <p>Fill in the details below to add a new employee</p> -->
        </h2>

    </div>

    <form method="POST" class="employee-form">
        <div class="form-group">
            <label for="number_contract" class="form-label">
                <!-- <i class="icon"></i> -->
                Номер договора
            </label>
            <input
                type="text"
                id="number_contract"
                name="number_contract"
                class="form-input"
                placeholder="формат--92100-ХХХЭА--"
                required
                autocomplete="off"
            >
            <span class="input-border"></span>
            <label for="date_contract" class="form-label">
                <!-- <i class="icon"></i> -->
                Дата договора
            </label>
            <input
                type="text"
                id="date_contract"
                name="date_contract"
                class="form-input"
                placeholder=" формат --01.01.2026--"
                required
                autocomplete="off"
            >
            <span class="input-border"></span>
        </div>
        <div class="form-group">
            <label for="thomas_of_property" class="form-label">
                <!-- <i class="icon"></i> -->
                Форма собственности
            </label>
            <input
                type="text"
                id="thomas_of_property"
                name="thomas_of_property"
                class="form-input"
                placeholder="--формат ООО---"
                required
                autocomplete="off"
            >
            <span class="input-border"></span>
        </div>

                <!-- <i class="icon"></i> -->
                Наименование организации

                type="text"
                id="name_of_the_organization"
                name="name_of_the_organization"
                class="form-input"
                placeholder="--организация--"
                required
                autocomplete="off"
            >
            <span class="input-border"></span>
        </div>
        <div class="form-group">
            <label for="abbreviated_name" class="form-label">
            Сокращенное наименование
            </label>

                id ="abbreviated_name"

                class="form-input"
                placeholder="--сокращенное фирменное наименование организации--"
                required
                autocomplete ="off"

            <span class="input-border"></span>
        </div>
        <div class="form-group">

        <div class="form-group">

        <div class="form-group">

        <div class="form-group">
